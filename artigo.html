<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artigo — VerdeID</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<nav class="nav"><div class="nav-inner"><a class="brand" href="index.html"><span class="brand-mark">V</span> VerdeID</a><div class="nav-links"><a href="painel.html">Painel</a><span data-auth-area></span></div></div></nav>
<main class="wrap"><section class="block"><div class="prose" id="box"></div></section></main>
<script src="assets/js/data.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/app.js"></script>
<script>
const s=Auth.exigir();
if(s){
  const id=new URLSearchParams(location.search).get("id");
  const a=window.VERDEID_ARTIGOS.find(x=>x.id===id);
  if(!a){ box.innerHTML=`<h1>Artigo não encontrado</h1><p><a href="painel.html">Voltar ao painel</a></p>`; }
  else if(a.nivel>s.nivel){ box.innerHTML=`<span class="badge-nivel">Nível ${a.nivel} · restrito</span><h1>Acesso negado</h1><p class="muted">Este artigo exige nível ${a.nivel} (${Auth.nomeNivel(a.nivel)}). Sua conta é nível ${s.nivel}. Isso demonstra o controle de acesso por perfil.</p><p><a class="btn btn-primary btn-small" href="painel.html">Voltar ao painel</a></p>`; }
  else{ box.innerHTML=`<span class="badge-nivel">Nível ${a.nivel} · ${Auth.nomeNivel(a.nivel)}</span><h1>${a.titulo}</h1><p class="muted">${a.resumo}</p><hr>${a.corpo.map(p=>`<p>${p}</p>`).join("")}<p><a class="btn btn-ghost btn-small" href="painel.html">← Voltar</a></p>`; }
}
</script>
</body>
</html>
