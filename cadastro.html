<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Criar conta — VerdeID</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark">V</span> VerdeID</a>
      <div class="nav-links"><a href="index.html">Início</a><a href="login.html">Entrar</a></div>
    </div>
  </nav>
  <main class="wrap"><section class="block">
    <form class="form" id="f-cad">
      <h1 style="margin:0">Criar conta</h1>
      <p class="muted">Preencha seus dados e capture sua foto pela webcam [PROVISÓRIO].</p>
      <div class="alert alert-err" id="erro" hidden></div>

      <label for="nome">Nome completo</label>
      <input id="nome" required autocomplete="name" placeholder="Seu nome completo">

      <label for="cpf">CPF (11 dígitos)</label>
      <input id="cpf" required autocomplete="off" placeholder="000.000.000-00" maxlength="14">

      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="email" placeholder="seu@email.com">

      <label for="senha">Senha (mín. 6)</label>
      <input id="senha" type="password" required autocomplete="new-password">

      <label for="nivel">Nível de acesso (permissão)</label>
      <select id="nivel" required>
        <option value="1">1 — Cidadão (guias, coleta seletiva, denúncias)</option>
        <option value="2">2 — Pesquisador (metodologias, relatórios técnicos)</option>
        <option value="3">3 — Gestor (fiscalização, áreas sensíveis, incidentes)</option>
      </select>

      <!-- Webcam para captura de foto -->
      <div class="card face" data-face-cad style="margin-top:20px">
        <div style="padding:16px 18px 0"><strong>Capturar foto (webcam)</strong>
          <p class="hint" id="msg-webcam" style="color:#BFD6C5">Clique em "Ativar câmera" para capturar sua foto.</p>
        </div>
        <div class="face-view" style="max-width:400px;margin:0 auto;">
          <video id="video-cad" autoplay playsinline muted style="width:100%;max-width:400px;height:auto;display:none;border-radius:12px;border:1px solid var(--line)"></video>
          <div id="foto-capturada" style="width:100%;max-width:400px;height:auto;display:none;border-radius:12px;border:1px solid var(--line);background:#000;"></div>
          <div class="face-oval" style="margin:10px auto">Posicione o rosto aqui</div>
        </div>
        <div style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-ghost btn-small" id="btn-webcam" type="button">Ativar câmera</button>
          <button class="btn btn-primary btn-small" id="btn-capturar" type="button" disabled>Capturar foto</button>
          <button class="btn btn-ghost btn-small" id="btn-limpar" type="button" disabled style="color:#A33B3B">Limpar foto</button>
        </div>
        <input type="hidden" id="foto-base64" value="">
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:14px" type="submit">Criar conta e entrar</button>
      <p class="hint">Ao criar, você concorda com o uso didático [DEMO] descrito em <a href="privacidade.html">Privacidade</a>.</p>
    </form>
  </section></main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const form = document.getElementById("f-cad");
    const nome = document.getElementById("nome");
    const cpf = document.getElementById("cpf");
    const email = document.getElementById("email");
    const senha = document.getElementById("senha");
    const nivel = document.getElementById("nivel");
    const erro = document.getElementById("erro");
    const msgWebcam = document.getElementById("msg-webcam");
    const video = document.getElementById("video-cad");
    const fotoCapturada = document.getElementById("foto-capturada");
    const btnWebcam = document.getElementById("btn-webcam");
    const btnCapturar = document.getElementById("btn-capturar");
    const btnLimpar = document.getElementById("btn-limpar");
    const fotoBase64 = document.getElementById("foto-base64");

    let streamAtual = null;
    let fotoBlob = null;

    // Máscara de CPF
    cpf.addEventListener("input", (e) => {
      let valor = e.target.value.replace(/\D/g, "");
      if (valor.length > 11) valor = valor.slice(0, 11);
      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
      valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      e.target.value = valor;
    });

    // Ativar câmera
    btnWebcam.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 } });
        streamAtual = stream;
        video.srcObject = stream;
        video.style.display = "block";
        fotoCapturada.style.display = "none";
        fotoBase64.value = "";
        fotoBlob = null;
        btnCapturar.disabled = false;
        btnLimpar.disabled = false;
        btnWebcam.disabled = true;
        btnWebcam.textContent = "Câmera ativa";
        msgWebcam.textContent = "Câmera ativa. Posicione o rosto e clique em “Capturar foto”.";
        msgWebcam.style.color = "#7CC79A";
      } catch (err) {
        console.error(err);
        msgWebcam.textContent = "Câmera indisponível. Você pode continuar o cadastro sem foto.";
        msgWebcam.style.color = "#A33B3B";
        btnCapturar.disabled = false;
        btnCapturar.textContent = "Usar foto de exemplo";
      }
    });

    // Capturar foto do vídeo
    btnCapturar.addEventListener("click", () => {
      if (!fotoBlob && !video.srcObject) {
        fotoCapturada.innerHTML = '<img src="https://images.pexels.com/photos/8090123/pexels-photo-8090123.jpeg?auto=compress&cs=tinysrgb&w=400" style="width:100%;border-radius:12px" alt="Foto de exemplo">';
        fotoCapturada.style.display = "block";
        fotoBase64.value = "exemplo";
        btnCapturar.disabled = true;
        msgWebcam.textContent = "Usando foto de exemplo para demonstração.";
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      canvas.toBlob((blob) => {
        fotoBlob = blob;
        const url = URL.createObjectURL(blob);
        fotoCapturada.innerHTML = `<img src="${url}" style="width:100%;border-radius:12px" alt="Foto capturada">`;
        fotoCapturada.style.display = "block";
        video.style.display = "none";

        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          fotoBase64.value = reader.result;
        };

        btnCapturar.disabled = true;
        msgWebcam.textContent = "Foto capturada com sucesso!";
        msgWebcam.style.color = "#7CC79A";
      }, "image/jpeg", 0.8);
    });

    // Limpar foto
    btnLimpar.addEventListener("click", () => {
      fotoCapturada.style.display = "none";
      fotoCapturada.innerHTML = "";
      fotoBase64.value = "";
      fotoBlob = null;
      btnCapturar.disabled = false;
      btnLimpar.disabled = true;
      btnCapturar.textContent = "Capturar foto";
      if (video.srcObject) video.style.display = "block";
      msgWebcam.textContent = "Foto removida. Capture novamente se desejar.";
      msgWebcam.style.color = "#BFD6C5";
    });

    window.addEventListener("beforeunload", () => {
      if (streamAtual) streamAtual.getTracks().forEach(t => t.stop());
    });

    // Validação de CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, "");
      if (cpf.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(10, 11))) return false;
      return true;
    }

    // Submeter cadastro
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.hidden = true;

      const cpfLimpo = cpf.value.replace(/\D/g, "");
      if (!validarCPF(cpfLimpo)) {
        erro.hidden = false;
        erro.textContent = "CPF inválido.";
        return;
      }

      const dados = {
        nome: nome.value.trim(),
        cpf: cpfLimpo,
        email: email.value.trim(),
        senha: senha.value,
        nivel: parseInt(nivel.value, 10),
        foto: fotoBase64.value || null,
      };

      try {
        // Tenta enviar para a API (backend com PostgreSQL + DeepFace)
        const resposta = await fetch("http://127.0.0.1:8000/usuarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cpf: dados.cpf,
            nome: dados.nome,
            nivel_acesso: dados.nivel,
            imagem: dados.foto ? dados.foto.split(",")[1] : null,
          }),
        });

        if (!resposta.ok) {
          const erroApi = await resposta.json();
          throw new Error(erroApi.detail || "Erro ao cadastrar na API.");
        }

        const resultado = await resposta.json();
        Auth.cadastrar(dados.email, dados.senha, dados.nome, dados.nivel, dados.cpf, dados.foto);
        location.href = "painel.html";

      } catch (err) {
        console.error("API indisponível, usando modo demo:", err);
        try {
          Auth.cadastrarComFoto(dados.nome, dados.email, dados.senha, dados.nivel, dados.cpf, dados.foto);
          location.href = "painel.html";
        } catch (err2) {
          erro.hidden = false;
          erro.textContent = err2.message || "Erro ao cadastrar. Verifique os dados e tente novamente.";
        }
      }
    });
  </script>
</body>
</html>
